<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNDMC | Conversor 5E para 3.5E</title>
    <style>
      .statblock {
        width: min(100%, 760px) !important;
        padding: 1.65rem !important;
      }
      .statblock h2 {
        font-size: clamp(1.55rem, 3.2vw, 2.35rem) !important;
        line-height: 1.05 !important;
        letter-spacing: .035em !important;
        overflow-wrap: anywhere;
      }
      .statblock header {
        padding-bottom: .55rem !important;
        margin-bottom: .75rem !important;
      }
      .statblock header p {
        font-size: .95rem !important;
      }
      .statblock section {
        gap: .28rem !important;
        font-size: .94rem !important;
      }
      .ability-text {
        white-space: normal !important;
        display: grid;
        gap: .7rem;
      }
      .ability-entry {
        margin: 0;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        line-height: 1.36;
      }
      .ability-name {
        font-weight: 900;
        font-style: italic;
        color: #3a170f;
      }
      .ac-target-card {
        border: 1px solid rgba(112, 63, 21, .26);
        background: rgba(255, 248, 232, .48);
        border-radius: 1rem;
        padding: .9rem;
        display: grid;
        gap: .75rem;
      }
      .ac-target-top {
        display: grid;
        gap: .35rem;
      }
      .ac-target-title {
        font-weight: 900;
        color: #6f1d16;
        font-size: .92rem;
      }
      .ac-target-text {
        color: #3a2414;
        font-size: .86rem;
        line-height: 1.35;
      }
      .ac-target-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .45rem;
      }
      .ac-target-actions button {
        min-height: 2.3rem;
        border-radius: .75rem;
        border: 1px solid rgba(126, 77, 28, .42);
        background: linear-gradient(180deg, #fff0c9 0%, #e4c27f 100%);
        color: #321908;
        font-weight: 900;
        font-size: .78rem;
        cursor: pointer;
      }
      .ac-target-actions button:hover {
        background: linear-gradient(180deg, #ffe8a3 0%, #d9a947 100%);
      }
      .ac-target-actions button:disabled {
        opacity: .45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const parseCr = (value) => {
        const text = String(value || '').trim().replace(',', '.');
        if (!text) return 0;
        if (text.includes('/')) {
          const [a, b] = text.split('/').map(Number);
          return b ? a / b : 0;
        }
        return Number(text) || 0;
      };

      const crForAc = (value) => {
        const cr = parseCr(value);
        return cr < 1 ? 0 : Math.round(cr);
      };

      const readInputByLabel = (labelText) => {
        const labels = Array.from(document.querySelectorAll('label'));
        const label = labels.find((el) => {
          const text = (el.querySelector('.field-label')?.textContent || el.textContent || '').trim();
          return text.toLowerCase().startsWith(labelText.toLowerCase());
        });
        return label?.querySelector('input, textarea, select') || null;
      };

      const setInputValue = (input, value) => {
        if (!input) return;
        const setter = Object.getOwnPropertyDescriptor(input.constructor.prototype, 'value')?.set
          || Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
        if (setter) setter.call(input, String(value));
        else input.value = String(value);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      };

      const readCalculatedAc = () => {
        const statLines = Array.from(document.querySelectorAll('.stat-line'));
        const acLine = statLines.find((line) => line.querySelector('strong')?.textContent?.includes('Classe de Armadura'));
        const text = acLine?.querySelector('span')?.textContent || '';
        const match = text.match(/\d+/);
        return match ? Number(match[0]) : 10;
      };

      const findDefensePanel = () => Array.from(document.querySelectorAll('.codex-panel')).find((panel) => {
        return panel.querySelector('h3')?.textContent?.trim().toLowerCase() === 'defesa';
      });

      const applyAcDifference = (fieldLabel) => {
        const ca5 = Number(readInputByLabel('CA 5E')?.value || 10);
        const nd5 = readInputByLabel('ND 5E')?.value || '0';
        const target = Math.round(ca5 + crForAc(nd5));
        const current = readCalculatedAc();
        const diff = target - current;
        if (!diff) return;
        const input = readInputByLabel(fieldLabel);
        const currentFieldValue = Number(input?.value || 0);
        setInputValue(input, currentFieldValue + diff);
      };

      const updateAcTargetCard = () => {
        const panel = findDefensePanel();
        if (!panel) return;
        let card = panel.querySelector('.ac-target-card');
        if (!card) {
          card = document.createElement('div');
          card.className = 'ac-target-card';
          card.innerHTML = `
            <div class="ac-target-top">
              <div class="ac-target-title">CA alvo sugerida</div>
              <div class="ac-target-text"></div>
            </div>
            <div class="ac-target-actions">
              <button type="button" data-ac-apply="Natural">Aplicar em Natural</button>
              <button type="button" data-ac-apply="Armadura">Aplicar em Armadura</button>
              <button type="button" data-ac-apply="Deflexão">Aplicar em Deflexão</button>
              <button type="button" data-ac-apply="Outros">Aplicar em Outros</button>
            </div>
          `;
          const content = panel.querySelector('.grid.gap-4');
          content?.insertBefore(card, content.firstChild);
          card.querySelectorAll('[data-ac-apply]').forEach((button) => {
            button.addEventListener('click', () => applyAcDifference(button.dataset.acApply));
          });
        }

        const ca5 = Number(readInputByLabel('CA 5E')?.value || 10);
        const nd5 = readInputByLabel('ND 5E')?.value || '0';
        const ndBonus = crForAc(nd5);
        const target = Math.round(ca5 + ndBonus);
        const current = readCalculatedAc();
        const diff = target - current;
        const diffText = diff === 0 ? 'A CA atual já bate com a sugestão.' : diff > 0 ? `Faltam +${diff}.` : `A CA atual está ${Math.abs(diff)} acima da sugestão.`;
        card.querySelector('.ac-target-text').textContent = `CA 5E ${ca5} + ND ${nd5} (${ndBonus >= 0 ? '+' + ndBonus : ndBonus}) = CA alvo ${target}. CA atual ${current}. ${diffText}`;
        card.querySelectorAll('[data-ac-apply]').forEach((button) => { button.disabled = diff === 0; });
      };

      new MutationObserver(updateAcTargetCard).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
      window.addEventListener('load', updateAcTargetCard);
      window.addEventListener('input', () => setTimeout(updateAcTargetCard, 0));
      window.addEventListener('change', () => setTimeout(updateAcTargetCard, 0));
      setInterval(updateAcTargetCard, 700);
    </script>
  </body>
</html>
